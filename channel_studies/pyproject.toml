[project]
name = "dit-channel-studies"
version = "0.1.0"
description = "Activation studies of massive-activation channels, high-norm tokens and the text stream in diffusion transformers."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
q9 = [
    "numpy>=1.26", "torch>=2.4", "diffusers==0.37.0", "transformers==4.57.6",
    "accelerate>=0.34", "pillow>=10.0", "matplotlib>=3.8", "scipy>=1.11",
    "sentencepiece>=0.2.0", "protobuf>=4.25", "lpips>=0.1.4", "open_clip_torch>=2.26",
]
# GPU dependencies for the model runs. They are imported lazily in the stages
# and model_utils, so the numeric code and the tests run without them.
# Install with pip install -e ".[fig3]".
fig3 = [
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "torch>=2.4",
    "torchvision>=0.19",
    # the FLUX attention processor used by generation_function.py targets this API
    "diffusers==0.37.0",  # Flux2KleinPipeline needs 0.37
    "transformers>=4.44",
    "accelerate>=0.34",
    "safetensors>=0.4",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    # needed by the BiRefNet remote code that stage4 loads
    "kornia>=0.7",
    "timm>=1.0",
    "einops>=0.8",
    # prompt sources in src/common/io.py (HF datasets and parquet files)
    "datasets>=2.19",
    "pandas>=2.0",
    "pyarrow>=14.0",
    # needed at load time by the T5 tokenizer and BiRefNet
    "sentencepiece>=0.2.0",
    "protobuf>=4.25",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    # numeric deps for the CPU tests
    "numpy>=1.26",
    "scikit-learn>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
# "." lets modules import as src.common.*, matching python -m src.<module>
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
